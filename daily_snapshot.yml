name: Daily market snapshot

on:
  schedule:
    # GitHub cron is always UTC. 03:30 UTC = 09:00 IST, Monday to Friday.
    - cron: "30 3 * * 1-5"
  workflow_dispatch:   # adds a "Run workflow" button for manual test runs

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Kolkata   # so the run time printed in the report/email is IST
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # 3.11 on purpose: pandas-datareader needs distutils, removed in Python 3.12+
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build snapshot and email it
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}   # optional; script default is used if empty
        run: python macro_market_snapshot.py
